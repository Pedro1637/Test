<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{

    --cobalto:#0F3D91;
    --cobalto-light:#2563EB;

    --dark:#081120;

    --paper:#F8F6F1;

    --gold:#D4A373;

    --gray:#64748B;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;

    font-family:'Poppins', sans-serif;

    background:
    linear-gradient(
        135deg,
        #081120,
        #0F3D91
    );
}

/* SIDEBAR */

.sidebar{

    width:260px;

    background:
    linear-gradient(
        180deg,
        #081120,
        #0F3D91
    );

    color:white;

    padding:30px 20px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    box-shadow:
    10px 0 30px rgba(0,0,0,0.25);
}

.logo{

    font-family:'Cinzel', serif;

    font-size:2rem;

    text-align:center;

    margin-bottom:40px;
}

/* PERFIL */

.profile{

    display:flex;
    align-items:center;

    gap:15px;

    margin-bottom:40px;
}

.avatar{

    width:60px;
    height:60px;

    border-radius:50%;

    background:white;

    color:var(--cobalto);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:1.4rem;

    font-weight:bold;
}

.profile-info h3{

    font-size:1rem;
}

.profile-info p{

    font-size:0.85rem;

    color:#CBD5E1;
}

/* MENU */

.menu{

    display:flex;
    flex-direction:column;

    gap:15px;
}

.menu a{

    color:white;

    text-decoration:none;

    padding:15px;

    border-radius:12px;

    transition:0.3s;
}

.menu a:hover{

    background:
    rgba(255,255,255,0.1);
}

/* MAIN */

.main{

    flex:1;

    padding:40px;
}

.title{

    color:white;

    font-family:'Cinzel', serif;

    font-size:2.5rem;

    margin-bottom:30px;
}

/* CARDS */

.cards{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

    margin-bottom:35px;
}

.card{

    background:var(--paper);

    padding:25px;

    border-radius:20px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.2);
}

.card h2{

    color:var(--cobalto);

    font-size:2.2rem;

    margin-bottom:10px;
}

.card p{

    color:var(--gray);
}

/* RESPONSIVO */

@media(max-width:900px){

    body{

        flex-direction:column;
    }

    .sidebar{

        width:100%;
    }

    .main{

        padding:25px;
    }

}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div>

        <div class="logo">
            Biblioteca
        </div>

        <!-- PERFIL ADMIN -->

        <div class="profile">

            <div class="avatar">
                A
            </div>

            <div class="profile-info">

                <h3>
                    Administrador
                </h3>

                <p>
                    Painel Administrativo
                </p>

            </div>

        </div>

        <!-- MENU -->

        <div class="menu">

            <a href="/admin">
                📚 Cadastrar Livros
            </a>

            <a href="/emprestimos">
                📖 Empréstimos
            </a>

            <a href="/devolucoes">
                🔄 Devoluções
            </a>

        </div>

    </div>

    <!-- SAIR -->

    <a
    href="/"
    style="
    color:white;
    text-decoration:none;
    font-weight:600;
    ">

         Sair

    </a>

</div>

<!-- MAIN -->

<div class="main">

    <h1 class="title">
        Dashboard Administrador
    </h1>

    <div class="cards">

        <div class="card">

            <h2>
                {{ livros_cadastrados }}
            </h2>

            <p>
                Livros cadastrados
            </p>

        </div>

        <div class="card">

            <h2>
                {{ emprestimos_ativos }}
            </h2>

            <p>
                Empréstimos ativos
            </p>

        </div>

        <div class="card">

            <h2>
                {{ devolucoes_pendentes }}
            </h2>

            <p>
                Devoluções pendentes
            </p>

        </div>

    </div>

</div>

</body>
</html>
