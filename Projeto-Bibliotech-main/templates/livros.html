<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Livros | Biblioteca</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{

    --cobalto:#0F3D91;
    --cobalto-light:#2563EB;

    --dark:#081120;

    --paper:#F8F6F1;

    --gold:#D4A373;

    --gray:#64748B;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    linear-gradient(
        135deg,
        #081120,
        #0F3D91
    );

    min-height:100vh;

    font-family:'Poppins', sans-serif;

    padding:40px;
}

/* CONTAINER */

.container{

    max-width:1400px;

    margin:auto;
}

/* HEADER */

.header{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:40px;
}

.header h1{

    color:white;

    font-family:'Cinzel', serif;

    font-size:2.8rem;
}

/* BOTÕES */

.btn{

    border:none;

    padding:14px 20px;

    border-radius:12px;

    cursor:pointer;

    color:white;

    font-weight:600;
}

.logout{

    background:#DC2626;
}

/* TÍTULOS */

.section-title{

    color:white;

    margin-bottom:20px;

    font-size:1.8rem;

    font-family:'Cinzel', serif;
}

/* GRID */

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:25px;

    margin-bottom:50px;
}

/* CARD */

.card{

    background:var(--paper);

    border-radius:25px;

    padding:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.2);

    transition:0.3s;
}

.card:hover{

    transform:translateY(-5px);
}

.card h2{

    color:var(--cobalto);

    margin-bottom:10px;
}

.card p{

    color:var(--gray);

    margin-bottom:8px;
}

/* STATUS */

.status{

    display:inline-block;

    margin-top:10px;

    padding:8px 14px;

    border-radius:10px;

    font-size:0.9rem;

    font-weight:600;
}

.disponivel{

    background:#DCFCE7;

    color:#166534;
}

.alugado{

    background:#FEE2E2;

    color:#991B1B;
}

/* BOTÃO ALUGAR */

.btn-alugar{

    margin-top:20px;

    width:100%;

    background:
    linear-gradient(
        135deg,
        var(--cobalto),
        var(--cobalto-light)
    );
}

/* RESPONSIVO */

@media(max-width:768px){

    body{

        padding:20px;
    }

    .header{

        flex-direction:column;

        gap:20px;
    }

}

</style>

</head>
<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>
            Biblioteca
        </h1>

        <button
        class="btn logout"
        onclick="voltar()">

            Voltar

        </button>

    </div>

    <!-- LIVROS DISPONÍVEIS -->

    <h2 class="section-title">
        Livros Disponíveis
    </h2>

    <div
    class="grid"
    id="livrosDisponiveis">

    </div>

    <!-- LIVROS ALUGADOS -->

    <h2 class="section-title">
        Meus Livros Alugados
    </h2>

    <div
    class="grid"
    id="livrosAlugados">

    </div>

</div>

<script>

/* VOLTAR PARA DASHBOARD */
function voltar(){

    window.location.href =
    '/dashboard_leitor';

}

/*AlUGAR LIVRO*/

async function alugarLivro(id){

    const formData = new FormData();


    formData.append(
        'id_livro',
        id
    );

    try{

        const response =
        await fetch(

            '/realizar_emprestimo',

            {

                method:'POST',

                body:formData

            }

        );

        if(response.ok){

            alert('Livro alugado!');

            carregarLivros();

        }else{

            alert('Erro ao alugar livro');

        }

    }catch(erro){

        console.log(erro);

    }

}


/* LOGOUT */

function logout(){

    localStorage.removeItem('token');

    window.location.href =
    '/';

}

/* CARREGAR LIVROS */

async function carregarLivros(){

    try{

        const response =
        await fetch(
            '/api/livros'
        );

        const livros =
        await response.json();

        const disponiveis =
        document.getElementById(
            'livrosDisponiveis'
        );

        const alugados =
        document.getElementById(
            'livrosAlugados'
        );

        disponiveis.innerHTML = '';
        alugados.innerHTML = '';

        livros.forEach(livro => {

            const card = `

                <div class="card">

                    <h2>
                        ${livro.titulo}
                    </h2>

                    <p>
                        Autor: ${livro.autor}
                    </p>

                    <p>
                        Categoria: ${livro.categoria}
                    </p>

                </div>

            `;

            if(livro.status === 'disponivel'){

                disponiveis.innerHTML += `

                    <div class="card">

                        <h2>
                            ${livro.titulo}
                        </h2>

                        <p>
                            Autor: ${livro.autor}
                        </p>

                        <p>
                            Categoria: ${livro.categoria}
                        </p>

                        <span class="status disponivel">

                            Disponível

                        </span>

                        <button
                        class="btn btn-alugar"
                        onclick="alugarLivro(${livro.id})">

                            Alugar Livro

                        </button>

                    </div>

                `;

            }else{

                alugados.innerHTML += `

                    <div class="card">

                        <h2>
                            ${livro.titulo}
                        </h2>

                        <p>
                            Autor: ${livro.autor}
                        </p>

                        <p>
                            Categoria: ${livro.categoria}
                        </p>

                        <span class="status alugado">

                            Alugado

                        </span>

                    </div>

                `;

            }

        });

    }catch(erro){

        console.log(erro);

    }

}

carregarLivros();

</script>

</body>
</html>
