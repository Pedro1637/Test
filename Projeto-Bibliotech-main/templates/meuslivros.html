<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<title>Meus Livros</title>

<style>

:root{

    --cobalto:#0F3D91;

}

body{

    font-family:Arial;

    background:#0F172A;

    color:white;

    padding:40px;
}

/* TÍTULO */

h1{

    margin-bottom:25px;
}

/* BOTÃO VOLTAR */

.btn-voltar{

    display:inline-block;

    margin-bottom:25px;

    background:white;

    color:var(--cobalto);

    text-decoration:none;

    padding:12px 20px;

    border-radius:12px;

    font-weight:600;
}

/* TABELA */

table{

    width:100%;

    background:white;

    color:black;

    border-collapse:collapse;

    border-radius:15px;

    overflow:hidden;
}

th{

    background:#2563EB;

    color:white;

    padding:15px;
}

td{

    padding:15px;

    border-bottom:1px solid #ddd;
}

/* BOTÃO */

.btn{

    background:#0F3D91;

    color:white;

    border:none;

    padding:10px 15px;

    border-radius:10px;

    cursor:pointer;
}

</style>

</head>

<body>

<!-- BOTÃO VOLTAR -->

<a
href="/dashboard_leitor"
class="btn-voltar">

    ← Voltar

</a>

<h1>
    Meus Livros
</h1>

<table>

    <thead>

        <tr>

            <th>Livro</th>
            <th>Data Empréstimo</th>
            <th>Devolução</th>
            <th>Ação</th>

        </tr>

    </thead>

    <tbody id="tabelaLivros">

        <!-- Dados carregados pelo Flask/Python -->

    </tbody>

</table>

<script>

async function carregarMeusLivros(){

    try{

        const response =
        await fetch('/meus_livros');

        const livros =
        await response.json();

        const tabela =
        document.getElementById(
            'tabelaLivros'
        );

        tabela.innerHTML = '';

        livros.forEach(livro => {

            tabela.innerHTML += `
            
            <tr>

                <td>
                    ${livro.titulo}
                </td>

                <td>
                    ${livro.data_emprestimo}
                </td>

                <td>
                    ${livro.data_devolucao}
                </td>

                <td>

                    <button
                    class="btn"
                    onclick="renovarLivro(${livro.id})">

                        Renovar

                    </button>

                </td>

            </tr>
            
            `;

        });

    }catch(erro){

        console.log(erro);

    }

}

function renovarLivro(id){

    alert(
        'Livro renovado!'
    );

}

carregarMeusLivros();

</script>

</body>
</html>
